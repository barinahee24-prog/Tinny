<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanny Script Hub | ศูนย์รวมสคริปต์</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #1a1a24;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: rgba(26, 26, 36, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at center, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 18px;
        }

        /* Grid Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px 20px;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Script Card */
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.2);
            border-color: rgba(139, 92, 246, 0.3);
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .tag.blox { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .tag.mm2 { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .tag.universal { background: rgba(16, 185, 129, 0.2); color: #34d399; }

        .btn-copy {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Kanit', sans-serif;
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanny Script Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d12; --card-bg: #1a1a24; --primary: #8b5cf6;
            --text-main: #f3f4f6; --text-muted: #9ca3af; --danger: #ef4444; --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; }

        /* Navbar */
        nav { background: rgba(26, 26, 36, 0.9); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-size: 20px; font-weight: 600; color: var(--primary); cursor: pointer; }
        .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-family: 'Kanit'; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #7c3aed; }
        .btn-danger { background: var(--danger); color: white; }

        /* Container Views */
        .view { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; }

        /* --- FRONTEND STYLES --- */
        .hero { text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 36px; margin-bottom: 10px; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        .card h3 { color: #a78bfa; margin-bottom: 10px; }
        .card p { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }
        
        /* --- BACKEND (ADMIN) STYLES --- */
        .login-box { max-width: 400px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; text-align: center; }
        .login-box input, .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #444; background: #0d0d12; color: white; font-family: 'Kanit'; }
        .form-group textarea { resize: vertical; height: 80px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .admin-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-item { background: var(--card-bg); padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .admin-item h4 { color: white; }
        .admin-item p { color: var(--text-muted); font-size: 12px; margin-top: 4px; }
        
        /* Alert */
        #alert { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 8px; color: white; font-weight: 600; display: none; z-index: 999; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo" onclick="switchView('home')">⚡ Tanny Script Hub</div>
        <button class="btn btn-primary" id="navBtn" onclick="switchView('admin')">🔒 หลังบ้าน (Admin)</button>
    </nav>

    <!-- View: Frontend Home -->
    <div id="view-home" class="view active">
        <div class="hero">
            <h1>ศูนย์รวมสคริปต์</h1>
            <p>กดคัดลอกเพื่อนำไปใช้ใน Executor</p>
        </div>
        <div class="grid" id="script-container">
            <!-- การ์ดจะถูกสร้างที่นี่โดย JavaScript -->
        </div>
    </div>

    <!-- View: Backend Admin -->
    <div id="view-admin" class="view">
        <!-- หน้า Login -->
        <div id="login-section" class="login-box">
            <h2 style="margin-bottom: 20px;">เข้าสู่ระบบแอดมิน</h2>
            <input type="password" id="password-input" placeholder="รหัสผ่าน">
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">เข้าสู่ระบบ</button>
        </div>

        <!-- หน้าจัดการหลังบ้าน (ซ่อนไว้ก่อน) -->
        <div id="admin-dashboard" style="display: none;">
            <div class="admin-header">
                <h2>จัดการสคริปต์</h2>
                <button class="btn btn-danger" onclick="logout()">ออกจากระบบ</button>
            </div>

            <!-- ฟอร์มเพิ่มสคริปต์ -->
            <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px;">➕ เพิ่มสคริปต์ใหม่</h3>
                <div class="form-group">
                    <input type="text" id="new-name" placeholder="ชื่อสคริปต์ (เช่น Tanny Blox Fruits)">
                </div>
                <div class="form-group">
                    <input type="text" id="new-desc" placeholder="คำอธิบายสั้นๆ">
                </div>
                <div class="form-group">
                    <input type="text" id="new-url" placeholder="ลิงก์ Raw Script (เช่น https://raw.githubusercontent.com/...)">
                </div>
                <button class="btn btn-primary" onclick="addScript()">บันทึกสคริปต์</button>
            </div>

            <h3 style="margin-bottom: 15px;">📋 รายการสคริปต์ทั้งหมด</h3>
            <div class="admin-list" id="admin-list-container">
                <!-- รายการจะถูกสร้างที่นี่ -->
            </div>
        </div>
    </div>

    <div id="alert">คัดลอกสำเร็จ!</div>

    <script>
        // ==========================================
        // ระบบฐานข้อมูลจำลอง (ใช้ LocalStorage)
        // ==========================================
        // ข้อมูลเริ่มต้น
        const defaultScripts = [
            { id: 1, name: "Tanny Universal Hub", desc: "สคริปต์ครอบจักรวาล Speed, Jump, Anti-AFK", url: "https://raw.githubusercontent.com/EdgeIY/infiniteyield/master/source" },
            { id: 2, name: "Tanny MM2 Map", desc: "ESP บทบาท และระบบวาร์ป", url: "https://raw.githubusercontent.com/EdgeIY/infiniteyield/master/source" }
        ];

        function getScripts() {
            let data = localStorage.getItem('tanny_scripts');
            if (!data) {
                localStorage.setItem('tanny_scripts', JSON.stringify(defaultScripts));
                return defaultScripts;
            }
            return JSON.parse(data);
        }

        function saveScripts(scripts) {
            localStorage.setItem('tanny_scripts', JSON.stringify(scripts));
            renderHome();
            renderAdmin();
        }

        // ==========================================
        // ระบบสลับหน้า (Routing)
        // ==========================================
        function switchView(view) {
            document.getElementById('view-home').classList.remove('active');
            document.getElementById('view-admin').classList.remove('active');
            
            if (view === 'home') {
                document.getElementById('view-home').classList.add('active');
                document.getElementById('navBtn').innerText = "🔒 หลังบ้าน (Admin)";
            } else {
                document.getElementById('view-admin').classList.add('active');
                document.getElementById('navBtn').innerText = "🏠 กลับหน้าแรก";
            }
            window.scrollTo(0, 0);
        }

        // ==========================================
        // ระบบ Frontend (หน้าแรก)
        // ==========================================
        function renderHome() {
            const container = document.getElementById('script-container');
            const scripts = getScripts();
            container.innerHTML = '';

            scripts.forEach(s => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${s.name}</h3>
                    <p>${s.desc}</p>
                    <button class="btn btn-primary" style="width:100%" onclick="copyScript('${s.url}')">📋 คัดลอกสคริปต์</button>
                `;
                container.appendChild(card);
            });
        }

        function copyScript(url) {
            const code = `loadstring(game:HttpGet("${url}"))()`;
            navigator.clipboard.writeText(code).then(() => {
                showAlert("✅ คัดลอกโค้ดเรียบร้อย!");
            });
        }

        // ==========================================
        // ระบบ Backend (หลังบ้าน)
        // ==========================================
        function login() {
            const pass = document.getElementById('password-input').value;
            if (pass === '311235') {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                renderAdmin();
            } else {
                showAlert("❌ รหัสผ่านไม่ถูกต้อง!", true);
            }
        }

        function logout() {
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('password-input').value = '';
        }

        function addScript() {
            const name = document.getElementById('new-name').value;
            const desc = document.getElementById('new-desc').value;
            const url = document.getElementById('new-url').value;

            if (!name || !url) {
                showAlert("⚠️ กรุณากรอกชื่อและลิงก์สคริปต์", true);
                return;
            }

            const scripts = getScripts();
            scripts.push({ id: Date.now(), name: name, desc: desc || "ไม่มีคำอธิบาย", url: url });
            saveScripts(scripts);

            // เคลียร์ฟอร์ม
            document.getElementById('new-name').value = '';
            document.getElementById('new-desc').value = '';
            document.getElementById('new-url').value = '';
            showAlert("✅ เพิ่มสคริปต์สำเร็จ!");
        }

        function deleteScript(id) {
            if(confirm("คุณแน่ใจหรือไม่ที่จะลบสคริปต์นี้?")) {
                let scripts = getScripts();
                scripts = scripts.filter(s => s.id !== id);
                saveScripts(scripts);
                showAlert("🗑️ ลบสคริปต์แล้ว");
            }
        }

        function renderAdmin() {
            const container = document.getElementById('admin-list-container');
            const scripts = getScripts();
            container.innerHTML = '';

            if (scripts.length === 0) {
                container.innerHTML = '<p style="color:gray">ยังไม่มีสคริปต์ในระบบ</p>';
                return;
            }

            scripts.forEach(s => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <div>
                        <h4>${s.name}</h4>
                        <p>${s.desc}</p>
                        <p style="color:#888; font-size:10px;">${s.url}</p>
                    </div>
                    <button class="btn btn-danger" onclick="deleteScript(${s.id})">ลบ</button>
                `;
                container.appendChild(item);
            });
        }

        // ==========================================
        // Helper Function
        // ==========================================
        function showAlert(msg, isError = false) {
            const alertBox = document.getElementById('alert');
            alertBox.innerText = msg;
            alertBox.style.background = isError ? 'var(--danger)' : 'var(--success)';
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 3000);
        }

        // เริ่มต้นโหลดข้อมูล
        renderHome();
    </script>
</body>
</html>
