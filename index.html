<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanny Script Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --primary: #a78bfa;
            --text-main: #ffffff;
            --text-muted: #d1d5db;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        
        body { 
            color: var(--text-main); 
            min-height: 100vh; 
            overflow-x: hidden;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0b2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav { 
            background: rgba(255, 255, 255, 0.03); padding: 15px 20px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); 
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px);
        }
        
        .logo { font-size: 20px; font-weight: 600; color: var(--primary); cursor: pointer; white-space: nowrap; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; justify-content: flex-end; }
        
        /* Language Selector */
        .lang-select {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid var(--glass-border);
            padding: 6px 10px;
            border-radius: 6px;
            font-family: 'Kanit';
            cursor: pointer;
            outline: none;
            max-width: 120px;
        }
        .lang-select option { background: #1a1a24; color: white; }

        .nav-buttons { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--glass-border); cursor: pointer; font-weight: 600; font-family: 'Kanit'; transition: all 0.2s ease; backdrop-filter: blur(5px); white-space: nowrap; }
        .btn-primary { background: rgba(139, 92, 246, 0.3); color: white; }
        .btn-danger { background: rgba(239, 68, 68, 0.3); color: white; }
        .btn-success { background: rgba(16, 185, 129, 0.3); color: white; }

        .view { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; animation: fadeInUp 0.5s ease-out forwards; }

        .hero { text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 36px; margin-bottom: 10px; }
        .hero p { color: var(--text-muted); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .card { 
            background: var(--glass-bg); backdrop-filter: blur(12px); padding: 20px; 
            border-radius: 16px; border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
        }
        .card h3 { color: #e9d5ff; margin-bottom: 10px; }
        .card p { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; }
        
        .glass-box { background: var(--glass-bg); backdrop-filter: blur(16px); padding: 30px; border-radius: 16px; border: 1px solid var(--glass-border); }
        .auth-box { max-width: 400px; margin: 50px auto; text-align: center; }
        
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2); color: white; font-family: 'Kanit'; }
        input:focus { outline: none; border-color: var(--primary); }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; }
        .admin-list { display: flex; flex-direction: column; gap: 10px; }
        .admin-item { background: rgba(255, 255, 255, 0.03); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); }

        #alert { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; display: none; z-index: 999; border: 1px solid rgba(255,255,255,0.3); }
        #alert.show { display: block; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Responsive */
        @media (max-width: 600px) {
            nav { flex-direction: column; gap: 10px; }
            .nav-right { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="switchView('home')">⚡ Tanny Script Hub</div>
        
        <div class="nav-right">
            <!-- ตัวเลือกภาษา 6 ภาษา -->
            <select class="lang-select" id="lang-select" onchange="changeLanguage(this.value)">
                <option value="th">🇹🇭 ไทย</option>
                <option value="en">🇬🇧 English</option>
                <option value="zh">🇨🇳 中文</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="es">🇪🇸 Español</option>
            </select>

            <div class="nav-buttons" id="nav-buttons"></div>
        </div>
    </nav>

    <div id="view-home" class="view active">
        <div class="hero">
            <h1 data-i18n="hero_title">ศูนย์รวมสคริปต์</h1>
            <p data-i18n="hero_subtitle">กดคัดลอกเพื่อนำไปใช้ใน Executor</p>
        </div>
        <div class="grid" id="script-container"></div>
    </div>

    <div id="view-auth" class="view">
        <div class="glass-box auth-box">
            <h2 id="auth-title" style="margin-bottom: 20px;" data-i18n="auth_login">เข้าสู่ระบบ</h2>
            <input type="text" id="auth-username" placeholder="ชื่อผู้ใช้ (Username)" data-i18n-ph="auth_username">
            <input type="password" id="auth-password" placeholder="รหัสผ่าน (Password)" data-i18n-ph="auth_password">
            
            <button class="btn btn-primary" id="auth-submit-btn" style="width: 100%; margin-bottom: 15px;" onclick="handleAuthSubmit()" data-i18n="auth_login">เข้าสู่ระบบ</button>
            
            <p style="color: var(--text-muted); font-size: 14px; cursor: pointer; text-decoration: underline;" onclick="toggleAuthMode()" id="auth-toggle-text" data-i18n="auth_no_account">
                ยังไม่มีบัญชี? สมัครสมาชิกที่นี่
            </p>
        </div>
    </div>

    <div id="view-admin" class="view">
        <div class="admin-header">
            <h2 data-i18n="admin_title">จัดการสคริปต์</h2>
        </div>
        <div class="glass-box" style="margin-bottom: 20px;">
            <h3 style="margin-bottom: 15px;" data-i18n="admin_add_title">➕ เพิ่มสคริปต์ใหม่</h3>
            <input type="text" id="new-name" placeholder="ชื่อสคริปต์" data-i18n-ph="admin_script_name">
            <input type="text" id="new-desc" placeholder="คำอธิบาย" data-i18n-ph="admin_script_desc">
            <input type="text" id="new-url" placeholder="ลิงก์ Raw Script" data-i18n-ph="admin_script_url">
            <button class="btn btn-success" onclick="addScript()" data-i18n="admin_btn_save">บันทึกสคริปต์</button>
        </div>
        <div class="admin-list" id="admin-list-container"></div>
    </div>

    <div id="alert">Alert!</div>

        // ตรวจจับภาษาของเบราว์เซอร์อัตโนมัติ (ถ้าไม่เคยเลือกไว้)
        let currentLang = 'th';
        try {
            const savedLang = localStorage.getItem('tanny_lang');
            if (savedLang && translations[savedLang]) {
                currentLang = savedLang;
            } else {
                const browserLang = navigator.language.slice(0, 2);
                if (translations[browserLang]) currentLang = browserLang;
            }
        } catch(e){}

        function t(key) { return translations[currentLang][key] || key; }

        function changeLanguage(lang) {
            currentLang = lang;
            try { localStorage.setItem('tanny_lang', lang); } catch(e){}
            document.getElementById('lang-select').value = lang;
            updateLanguageUI();
        }

        function updateLanguageUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key) el.innerText = t(key);
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (key) el.placeholder = t(key);
            });
            updateNavbar();
            renderHome();
            renderAdmin();
            updateAuthToggleText();
        }

        // ==========================================
        // 2. ระบบฐานข้อมูลจำลอง (Memory Fallback)
        // ==========================================
        let memoryUsers = [{ username: "admin", password: "admin123", role: "admin" }];
        let memoryScripts = [{ id: 1, name: "Tanny Universal Hub", desc: "Universal Script", url: "https://raw.githubusercontent.com/EdgeIY/infiniteyield/master/source" }];
        let memorySession = null;

        function getUsers() { try { return JSON.parse(localStorage.getItem('tanny_users')) || memoryUsers; } catch(e) { return memoryUsers; } }
        function saveUsers(u) { memoryUsers = u; try { localStorage.setItem('tanny_users', JSON.stringify(u)); } catch(e) {} }

        function getScripts() { try { return JSON.parse(localStorage.getItem('tanny_scripts')) || memoryScripts; } catch(e) { return memoryScripts; } }
        function saveScripts(s) { memoryScripts = s; try { localStorage.setItem('tanny_scripts', JSON.stringify(s)); } catch(e) {} }

        function getCurrentUser() { try { return JSON.parse(localStorage.getItem('tanny_session')) || memorySession; } catch(e) { return memorySession; } }
        function setSession(u) {
            memorySession = u;
            try { if(u) localStorage.setItem('tanny_session', JSON.stringify(u)); else localStorage.removeItem('tanny_session'); } catch(e) {}
            updateNavbar();
        }

        // ==========================================
        // 3. ระบบ Navbar & Routing
        // ==========================================
        function updateNavbar() {
            const navBtns = document.getElementById('nav-buttons');
            const user = getCurrentUser();

            if (user) {
                let adminBtn = user.role === 'admin' ? `<button class="btn btn-success" onclick="switchView('admin')">${t('nav_admin')}</button>` : '';
                navBtns.innerHTML = `
                    ${adminBtn}
                    <span style="color:white; align-self:center; font-size:14px;">👤 ${user.username}</span>
                    <button class="btn btn-danger" onclick="logout()">${t('nav_logout')}</button>
                `;
            } else {
                navBtns.innerHTML = `<button class="btn btn-primary" onclick="switchView('auth')">${t('nav_login')}</button>`;
            }
        }

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (viewName === 'admin') {
                const user = getCurrentUser();
                if (!user || user.role !== 'admin') {
                    showAlert(t('alert_error_auth'), true);
                    viewName = 'home';
                }
            }
            document.getElementById(`view
