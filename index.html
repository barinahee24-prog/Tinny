<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Music Player & Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        
        body {
            background-color: #121212;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Header & Nav ===== */
        header {
            padding: 15px 20px;
            background: linear-gradient(to bottom, #1DB95444, transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header h1 { font-size: 20px; font-weight: 600; background: -webkit-linear-gradient(#1DB954, #1ed760); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-btn {
            background: #282828; color: #fff; border: 1px solid #444;
            padding: 8px 16px; border-radius: 20px; cursor: pointer;
            font-size: 14px; transition: 0.2s;
        }
        .nav-btn:hover { background: #333; border-color: #1DB954; color: #1DB954; }

        /* ===== Views (Player / Admin) ===== */
        .view { flex: 1; overflow-y: auto; display: none; padding-bottom: 120px; }
        .view.active { display: block; }
        
        /* ===== Playlist View ===== */
        .playlist-container { padding: 10px 20px; }
        .playlist-container::-webkit-scrollbar { width: 6px; }
        .playlist-container::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .song-item {
            display: flex; align-items: center;
            padding: 12px; border-radius: 12px;
            cursor: pointer; transition: background 0.3s; margin-bottom: 8px;
        }
        .song-item:hover { background: #2a2a2a; }
        .song-item.active { background: #1DB95422; border: 1px solid #1DB954; }
        .song-item.active .song-title { color: #1DB954; }

        .song-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; margin-right: 15px; background: #333; }
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-artist { font-size: 12px; color: #b3b3b3; }
        .play-icon { color: #b3b3b3; font-size: 18px; margin-left: 10px; }

        /* ===== Admin View (ฟอร์มเพิ่มเพลง) ===== */
        .admin-container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .admin-title { font-size: 22px; margin-bottom: 20px; color: #1DB954; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #b3b3b3; }
        .form-group input {
            width: 100%; padding: 10px; border-radius: 8px;
            border: 1px solid #444; background: #222; color: #fff;
            font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: #1DB954; }
        
        .btn-submit {
            width: 100%; padding: 12px; background: #1DB954; color: #fff;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 10px; transition: 0.2s;
        }
        .btn-submit:hover { background: #1ed760; transform: scale(1.02); }

        /* Admin Song List */
        .admin-list { margin-top: 30px; }
        .admin-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #222; padding: 10px 15px; border-radius: 8px; margin-bottom: 8px;
        }
        .admin-item-info { flex: 1; overflow: hidden; }
        .admin-item-title { font-size: 14px; font-weight: 600; }
        .admin-item-artist { font-size: 12px; color: #b3b3b3; }
        .btn-delete {
            background: #ff4444; color: #fff; border: none;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .btn-delete:hover { background: #ff0000; }

        /* ===== Bottom Player Bar ===== */
        .player-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #181818; border-top: 1px solid #282828;
            padding: 15px 20px; display: flex; flex-direction: column; gap: 12px; z-index: 100;
        }
        .progress-container { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #b3b3b3; }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 4px;
            background: #404040; border-radius: 2px; outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #fff;
        }
        input[type="range"]::-webkit-slider-thumb:hover { background: #1DB954; }

        .player-controls { display: flex; align-items: center; justify-content: space-between; }
        .current-song { display: flex; align-items: center; gap: 12px; width: 30%; min-width: 150px; }
        .current-song img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
        .current-song-info { display: flex; flex-direction: column; overflow: hidden; }
        .current-song-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .current-song-artist { font-size: 12px; color: #b3b3b3; }

        .buttons { display: flex; align-items: center; gap: 20px; }
        .btn-control { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .btn-control:hover { color: #1DB954; transform: scale(1.1); }
        .btn-play {
            background: #fff; color: #000; width: 45px; height: 45px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .btn-play:hover { background: #1DB954; color: #fff; }

        .volume-control { display: flex; align-items: center; gap: 8px; width: 20%; justify-content: flex-end; }
        .volume-control input { width: 80px; }

        @media (max-width: 600px) {
            .current-song-info { display: none; }
            .volume-control { display: none; }
            .player-controls { justify-content: center; gap: 30px; }
        }
    </style>
</head>

<script>
    // ==========================================
    // 🔐 1. ระบบหลังบ้าน & Cloud Database (JSONBin)
    // ==========================================
    const ADMIN_PASSWORD = "311235";
    
    // ข้อมูลเชื่อมต่อ JSONBin (ที่คุณใส่ไว้แล้ว)
    const BIN_ID = '6af47a3effd5d16053b98a6d'; 
    const API_KEY = '$2a$10$wO2rqJLA7xLGjHVpgzMX.YA5K25WIrTopILtnVif/zaJ6X0vQQiy'; 
    const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let isAdminLoggedIn = false;
    let songs = []; // เริ่มต้นเป็นค่าว่าง รอโหลดจากคลาวด์
    let currentSongIndex = 0;
    let isPlaying = false;

    // ฟังก์ชันดึงข้อมูลจาก Cloud
    async function loadFromCloud() {
        try {
            const response = await fetch(JSONBIN_URL + '/latest', {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await response.json();
            songs = data.record.songs || []; 
            renderPlaylist();
            renderAdminList();
        } catch (error) {
            console.error("โหลดข้อมูลไม่ได้", error);
            alert("❌ โหลดข้อมูลเพลงไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต");
        }
    }

    // ฟังก์ชันบันทึกข้อมูลขึ้น Cloud
    async function saveToCloud() {
        try {
            await fetch(JSONBIN_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ songs: songs })
            });
            renderAdminList(); 
            renderPlaylist();
        } catch (error) {
            alert("❌ บันทึกข้อมูลไม่สำเร็จ");
        }
    }

    // สลับหน้าจอ Player <-> Admin
    function toggleView() {
        const playerView = document.getElementById('playerView');
        const adminView = document.getElementById('adminView');
        const navBtn = document.getElementById('navToggleBtn');

        if (adminView.classList.contains('active')) {
            adminView.classList.remove('active');
            playerView.classList.add('active');
            navBtn.textContent = '⚙️ จัดการเพลง';
        } else {
            if (!isAdminLoggedIn) {
                const pass = prompt("🔒 กรุณาใส่รหัสผ่าน:");
                if (pass === ADMIN_PASSWORD) {
                    isAdminLoggedIn = true;
                } else if (pass !== null) {
                    alert("❌ รหัสผ่านไม่ถูกต้อง!");
                    return;
                } else {
                    return; 
                }
            }
            playerView.classList.remove('active');
            adminView.classList.add('active');
            navBtn.textContent = '🎵 กลับไปหน้าฟังเพลง';
            renderAdminList();
        }
    }

    // เพิ่มเพลงใหม่ (บันทึกลง Cloud)
    function addNewSong() {
        const title = document.getElementById('addTitle').value.trim();
        const artist = document.getElementById('addArtist').value.trim();
        const cover = document.getElementById('addCover').value.trim() || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&h=200&fit=crop';
        const url = document.getElementById('addUrl').value.trim();

        if (!title || !url) {
            alert("⚠️ กรุณากรอกชื่อเพลงและลิงก์ MP3");
            return;
        }

        songs.push({ title, artist: artist || 'Unknown Artist', cover, url });
        saveToCloud(); // เซฟลงคลาวด์
        
        document.getElementById('addTitle').value = '';
        document.getElementById('addArtist').value = '';
        document.getElementById('addCover').value = '';
        document.getElementById('addUrl').value = '';
        
        alert("✅ เพิ่มเพลงสำเร็จ!");
    }

    // ลบเพลง (บันทึกลง Cloud)
    function deleteSong(index) {
        if (confirm(`ลบเพลง "${songs[index].title}" ใช่หรือไม่?`)) {
            songs.splice(index, 1);
            saveToCloud(); // เซฟลงคลาวด์
            
            if (currentSongIndex === index) {
                const audio = document.getElementById('audioPlayer');
                audio.pause();
                isPlaying = false;
                document.getElementById('playBtn').textContent = '▶';
                document.getElementById('currentTitle').textContent = 'เลือกเพลงเพื่อเล่น';
                document.getElementById('currentArtist').textContent = '-';
            }
        }
    }

    // แสดงรายการเพลงในหลังบ้าน
    function renderAdminList() {
        const list = document.getElementById('adminSongList');
        list.innerHTML = '';
        songs.forEach((song, index) => {
            const div = document.createElement('div');
            div.className = 'admin-item';
            div.innerHTML = `
                <div class="admin-item-info">
                    <div class="admin-item-title">${song.title}</div>
                    <div class="admin-item-artist">${song.artist}</div>
                </div>
                <button class="btn-delete" onclick="deleteSong(${index})">ลบ</button>
            `;
            list.appendChild(div);
        });
    }

    // ==========================================
    // 🎵 2. ระบบเล่นเพลง (Player)
    // ==========================================
    const audio = document.getElementById('audioPlayer');
    const playlistEl = document.getElementById('playlist');
    const playBtn = document.getElementById('playBtn');
    const progressBar = document.getElementById('progressBar');
    const volumeBar = document.getElementById('volumeBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const currentCover = document.getElementById('currentCover');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');

    function renderPlaylist() {
        playlistEl.innerHTML = '';
        songs.forEach((song, index) => {
            const item = document.createElement('div');
            item.className = `song-item ${index === currentSongIndex && isPlaying ? 'active' : ''}`;
            item.onclick = () => playSong(index);
            
            item.innerHTML = `
                <img src="${song.cover}" class="song-img" alt="cover" onerror="this.src='https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=200&h=200&fit=crop'">
                <div class="song-info">
                    <div class="song-title">${song.title}</div>
                    <div class="song-artist">${song.artist}</div>
                </div>
                <div class="play-icon">${index === currentSongIndex && isPlaying ? '🎵' : '▶'}</div>
            `;
            playlistEl.appendChild(item);
        });
    }

    function playSong(index) {
        if (songs.length === 0) return;
        currentSongIndex = index;
        const song = songs[index];
        
        audio.src = song.url;
        audio.play().catch(e => alert("ไม่สามารถเล่นไฟล์นี้ได้ กรุณาตรวจสอบลิงก์ MP3"));
        isPlaying = true;
        
        currentCover.src = song.cover;
        currentTitle.textContent = song.title;
        currentArtist.textContent = song.artist;
        playBtn.textContent = '⏸';
        
        renderPlaylist();
    }

    function togglePlay() {
        if (songs.length === 0) {
            alert("ยังไม่มีเพลงในระบบ");
            return;
        }
        if (!audio.src) {
            playSong(0);
            return;
        }

        if (isPlaying) {
            audio.pause();
            playBtn.textContent = '▶';
        } else {
            audio.play();
            playBtn.textContent = '⏸';
        }
        isPlaying = !isPlaying;
        renderPlaylist();
    }

    function nextSong() {
        if (songs.length === 0) return;
        currentSongIndex = (currentSongIndex + 1) % songs.length;
        playSong(currentSongIndex);
    }

    function prevSong() {
        if (songs.length === 0) return;
        currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
        playSong(currentSongIndex);
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressBar.value = percent;
            currentTimeEl.textContent = formatTime(audio.currentTime);
        }
    });

    audio.addEventListener('loadedmetadata', () => {
        durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
        nextSong();
    });

    progressBar.addEventListener('input', () => {
        const seekTime = (progressBar.value / 100) * audio.duration;
        audio.currentTime = seekTime;
    });

    volumeBar.addEventListener('input', () => {
        audio.volume = volumeBar.value;
    });
    audio.volume = volumeBar.value;

    // ==========================================
    // 🚀 3. เริ่มต้นระบบ
    // ==========================================
    // สั่งให้โหลดข้อมูลจาก Cloud ทันทีที่เปิดเว็บ
    loadFromCloud();

</script>
</body>
</html>
