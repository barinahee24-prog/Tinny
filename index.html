<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Drop — แจกเพลง + จัดการคลัง</title>

  <style>
    :root {
      --bg: #0b0f19;
      --bg-soft: #121827;
      --card: #171f31;
      --card-hover: #1d2740;
      --text: #f4f7ff;
      --muted: #9aa7c2;
      --accent: #ff4d8d;
      --accent-2: #7c5cff;
      --ok: #2ee6a6;
      --warn: #ffb020;
      --danger: #ff5c5c;
      --line: rgba(255,255,255,.1);
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(124,92,255,.25), transparent 35%),
        radial-gradient(circle at 90% 10%, rgba(255,77,141,.18), transparent 30%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    .container { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    .hidden { display: none !important; }

    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(16px);
      background: rgba(11,15,25,.72);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 0;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .3px; }
    .logo-icon {
      width: 38px; height: 38px; display: grid; place-items: center;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(255,77,141,.35);
    }
    .view-tabs { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
    .view-tabs button {
      border: 0; background: transparent; color: var(--muted);
      padding: 8px 16px; border-radius: 999px; cursor: pointer;
      font-size: 14px; font-weight: 700; transition: .2s;
    }
    .view-tabs button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
    }
    .view-tabs button:hover:not(.active) { color: var(--text); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid transparent; border-radius: 999px;
      padding: 11px 20px; cursor: pointer; font-weight: 700;
      transition: .2s; white-space: nowrap; font-size: 14px;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; box-shadow: 0 10px 30px rgba(255,77,141,.25); }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-ghost { background: rgba(255,255,255,.06); border-color: var(--line); color: var(--text); }
    .btn-ghost:hover { background: rgba(255,255,255,.1); }
    .btn-danger { background: rgba(255,92,92,.12); border-color: rgba(255,92,92,.35); color: #ffb3b3; }
    .btn-danger:hover { background: rgba(255,92,92,.2); }
    .btn-ok { background: rgba(46,230,166,.12); border-color: rgba(46,230,166,.35); color: #9cf4d6; }
    .btn-ok:hover { background: rgba(46,230,166,.2); }
    .btn.small { padding: 8px 14px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Hero */
    .hero { padding: 60px 0 30px; display: grid; grid-template-columns: 1.3fr .7fr; gap: 32px; align-items: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: #ffb3cf; background: rgba(255,77,141,.12);
      border: 1px solid rgba(255,77,141,.25);
      padding: 7px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700; margin-bottom: 18px;
    }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 56px); line-height: 1.1; letter-spacing: -1.2px; }
    .gradient-text { background: linear-gradient(135deg, #ff8ab8, #b7a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { color: var(--muted); font-size: 16px; max-width: 620px; margin: 18px 0 26px; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .hero-card {
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
      border: 1px solid var(--line); border-radius: 28px; padding: 24px;
      box-shadow: var(--shadow); transform: rotate(2deg);
    }
    .disc {
      width: 160px; height: 160px; margin: 0 auto 20px; border-radius: 50%;
      background: radial-gradient(circle at center, #0b0f19 0 14%, transparent 15%),
                  repeating-radial-gradient(circle at center, #2a3350 0 2px, #171f31 3px 9px);
      border: 1px solid rgba(255,255,255,.12);
      animation: spin 12s linear infinite; position: relative;
    }
    .disc::after {
      content: ""; position: absolute; inset: 38%; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Controls */
    .controls { margin: 10px 0 26px; display: flex; flex-direction: column; gap: 14px; }
    .search-row { display: flex; gap: 12px; align-items: center; }
    .search-box { flex: 1; position: relative; }
    .search-box span { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-box input {
      width: 100%; padding: 14px 16px 14px 44px;
      border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,.06); color: var(--text); outline: none;
    }
    .search-box input:focus { border-color: rgba(255,77,141,.6); box-shadow: 0 0 0 4px rgba(255,77,141,.12); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-btn {
      border: 1px solid var(--line); background: rgba(255,255,255,.04);
      color: var(--muted); padding: 8px 14px; border-radius: 999px;
      cursor: pointer; transition: .2s; font-size: 14px;
    }
    .filter-btn:hover { color: var(--text); }
    .filter-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; }

    .section-title { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .section-title h2 { margin: 0; font-size: 24px; letter-spacing: -.5px; }
    .section-title p { margin: 0; color: var(--muted); font-size: 14px; }

    /* Song grid */
    .song-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; padding-bottom: 60px; }
    .card {
      background: linear-gradient(180deg, var(--card), rgba(23,31,49,.72));
      border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; transition: .25s ease;
      display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(255,77,141,.35); background: linear-gradient(180deg, var(--card-hover), rgba(29,39,64,.8)); box-shadow: var(--shadow); }
    .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #0a0e17; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
    .card:hover .thumb img { transform: scale(1.06); }
    .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.55), transparent 55%); pointer-events: none; }
    .play {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 56px; height: 56px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.95); color: #111;
      display: grid; place-items: center; font-size: 20px; cursor: pointer;
      opacity: 0; transition: .25s; z-index: 2; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .card:hover .play, .play:focus-visible { opacity: 1; }
    .badge {
      position: absolute; left: 12px; bottom: 12px; z-index: 2;
      padding: 5px 10px; border-radius: 999px;
      background: rgba(11,15,25,.78); border: 1px solid rgba(255,255,255,.14);
      color: #dfe7ff; font-size: 12px; font-weight: 700; backdrop-filter: blur(8px);
    }
    .card-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-body h3 { margin: 0; font-size: 16px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .artist { margin: 0; color: #ffb3cf; font-size: 13px; font-weight: 700; }
    .desc { margin: 4px 0 12px; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: rgba(255,255,255,.02); }

    /* Admin */
    .admin-wrap { padding: 40px 0 60px; }
    .admin-wrap h1 { font-size: 30px; margin-bottom: 6px; }
    .admin-wrap > p { color: var(--muted); margin-top: 0; }
    .panel {
      background: linear-gradient(180deg, var(--card), rgba(23,31,49,.72));
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 22px; margin-bottom: 18px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 18px; }
    .panel .hint { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .panel .hint a { color: #ffb3cf; text-decoration: underline; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .row input, .row select, .row textarea {
      background: rgba(255,255,255,.06); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 14px; outline: none;
    }
    .row input:focus, .row select:focus, .row textarea:focus {
      border-color: rgba(255,77,141,.6); box-shadow: 0 0 0 4px rgba(255,77,141,.12);
    }
    .row input[type="password"], .row input[type="text"] { flex: 1; min-width: 220px; }
    .admin-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .admin-tabs button {
      padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
      background: rgba(255,255,255,.04); color: var(--muted); cursor: pointer; font-weight: 700;
    }
    .admin-tabs button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; }

    .yt-result {
      display: grid; grid-template-columns: 160px 1fr auto; gap: 14px;
      background: rgba(255,255,255,.03); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px; margin-bottom: 10px;
      align-items: center;
    }
    .yt-result img { width: 100%; border-radius: 10px; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .yt-result h3 { margin: 0 0 4px; font-size: 15px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .yt-result .meta { color: var(--muted); font-size: 12px; }
    .yt-result .meta .dur { color: #ffb3cf; font-weight: 700; }

    .manage-row {
      display: grid; grid-template-columns: 1fr auto; gap: 12px;
      padding: 12px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(255,255,255,.03); margin-bottom: 8px;
      align-items: center;
    }
    .manage-row .info strong { display: block; font-size: 14px; }
    .manage-row .info span { color: var(--muted); font-size: 12px; }
    .manage-row .actions { display: flex; gap: 6px; }

    /* Modal */
    .modal {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center; padding: 18px;
      background: rgba(0,0,0,.75); backdrop-filter: blur(8px);
      opacity: 0; visibility: hidden; transition: .2s;
    }
    .modal.show { opacity: 1; visibility: visible; }
    .modal-box {
      width: min(900px, 100%);
      background: var(--bg-soft); border: 1px solid var(--line);
      border-radius: 22px; overflow: hidden;
      box-shadow: 0 30px 100px rgba(0,0,0,.6);
      transform: translateY(12px) scale(.98); transition: .2s;
      max-height: 92vh; display: flex; flex-direction: column;
    }
    .modal.show .modal-box { transform: translateY(0) scale(1); }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }
    .modal-head h3 { margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .close-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid var(--line); background: rgba(255,255,255,.06);
      color: var(--text); cursor: pointer; font-size: 22px; line-height: 1;
      display: grid; place-items: center; flex: 0 0 auto;
    }
    .close-btn:hover { background: rgba(255,255,255,.12); }
    .video-wrap { position: relative; padding-top: 56.25%; background: #000; }
    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .modal-info { padding: 14px 18px 18px; color: var(--muted); font-size: 14px; }

    .form-grid { display: grid; gap: 12px; padding: 18px; overflow-y: auto; }
    .form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
    .form-grid input, .form-grid select, .form-grid textarea {
      background: rgba(255,255,255,.06); color: var(--text);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 10px 12px; outline: none; width: 100%;
    }
    .form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus {
      border-color: rgba(255,77,141,.6); box-shadow: 0 0 0 3px rgba(255,77,141,.12);
    }
    .form-grid textarea { resize: vertical; min-height: 70px; }
    .form-grid .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; }

    /* Toast */
    .toast-wrap {
      position: fixed; right: 20px; bottom: 20px; z-index: 200;
      display: flex; flex-direction: column; gap: 8px;
    }
    .toast {
      background: var(--bg-soft); border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      padding: 12px 16px; border-radius: 10px;
      box-shadow: 0 15px 40px rgba(0,0,0,.5);
      font-size: 14px; max-width: 340px;
      animation: slideIn .25s ease;
    }
    .toast.ok { border-left-color: var(--ok); }
    .toast.err { border-left-color: var(--danger); }
    .toast.warn { border-left-color: var(--warn); }
    @keyframes slideIn { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: white;
      animation: spin .7s linear infinite;
      display: inline-block; vertical-align: -3px;
    }

    /* Footer */
    .site-footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

    /* =========================================
       INTRO OVERLAY
    ========================================= */
    .intro-overlay {
      position: fixed; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      background: rgba(11,15,25,.92);
      backdrop-filter: blur(20px);
      padding: 24px;
      transition: opacity .5s, visibility .5s;
    }
    .intro-overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-card { max-width: 520px; width: 100%; text-align: center; animation: fadeUp .5s ease; }
    .intro-card .big-logo {
      width: 100px; height: 100px; border-radius: 28px;
      margin: 0 auto 24px; display: grid; place-items: center; font-size: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 20px 60px rgba(255,77,141,.4);
      animation: introPulse 2s ease-in-out infinite;
    }
    @keyframes introPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .intro-card h2 { margin: 0 0 8px; font-size: 26px; }
    .intro-card p { color: var(--muted); margin: 0 0 24px; min-height: 24px; }
    .intro-progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
    .intro-progress span {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      animation: introBounce 1.2s infinite;
    }
    .intro-progress span:nth-child(2) { animation-delay: .15s; }
    .intro-progress span:nth-child(3) { animation-delay: .3s; }
    @keyframes introBounce { 0%,80%,100% { opacity: .3; transform: scale(.7); } 40% { opacity: 1; transform: scale(1); } }
    .intro-play-btn {
      padding: 16px 40px; font-size: 18px; border-radius: 999px; border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white; cursor: pointer; font-weight: 800;
      box-shadow: 0 15px 40px rgba(255,77,141,.4);
      transition: transform .2s; display: none;
    }
    .intro-play-btn.show { display: inline-block; }
    .intro-play-btn:hover { transform: scale(1.05); }
    .intro-skip {
      display: block; margin: 16px auto 0; background: none; border: 0;
      color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 13px;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================
       MINI PLAYER
    ========================================= */
    .mini-player {
      position: fixed; bottom: 20px; left: 20px; z-index: 90;
      background: var(--bg-soft); border: 1px solid var(--line);
      border-radius: 16px; padding: 10px 12px 10px 10px;
      display: none; align-items: center; gap: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,.5); max-width: 340px;
      backdrop-filter: blur(12px);
    }
    .mini-player.show { display: flex; animation: miniSlideUp .3s ease; }
    .mini-player img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; flex: 0 0 auto; }
    .mini-player .mp-info { flex: 1; min-width: 0; }
    .mini-player .mp-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-player .mp-artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-player .mp-btn {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
      background: rgba(255,255,255,.06); color: var(--text); cursor: pointer;
      display: grid; place-items: center; font-size: 14px; flex: 0 0 auto;
    }
    .mini-player .mp-btn:hover { background: rgba(255,255,255,.12); }
    .mini-player .mp-btn.play { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; }
    @keyframes miniSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Hidden YT Player */
    #introPlayerWrap { position: fixed; left: -9999px; top: -9999px; width: 1px; height: 1px; overflow: hidden; pointer-events: none; }

    @media (max-width: 860px) {
      .hero { grid-template-columns: 1fr; padding-top: 40px; }
      .hero-card { display: none; }
      .yt-result { grid-template-columns: 100px 1fr; }
      .yt-result .yt-add { grid-column: 1 / -1; }
      .view-tabs { padding: 3px; }
      .view-tabs button { paddin
