<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanny Hub - Real-time Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --primary: #a78bfa; --text-main: #fff; --text-muted: #d1d5db;
            --danger: #ef4444; --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { color: var(--text-main); min-height: 100vh; background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a0b2e); background-size: 400% 400%; animation: gradientBG 15s ease infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        nav { background: rgba(255, 255, 255, 0.03); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(15px); }
        .logo { font-size: 20px; font-weight: 600; color: var(--primary); cursor: pointer; }
        .nav-right { display: flex; align-items: center; gap: 15px; }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--glass-border); cursor: pointer; font-weight: 600; font-family: 'Kanit'; transition: 0.2s; }
        .btn-primary { background: rgba(139, 92, 246, 0.3); color: white; }
        .btn-danger { background: rgba(239, 68, 68, 0.3); color: white; }
        .btn-success { background: rgba(16, 185, 129, 0.3); color: white; }

        .view { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hero { text-align: center; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card, .glass-box { background: var(--glass-bg); backdrop-filter: blur(12px); padding: 20px; border-radius: 16px; border: 1px solid var(--glass-border); }
        .auth-box { max-width: 400px; margin: 50px auto; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.2); color: white; font-family: 'Kanit'; }
        
        /* Admin Tabs */
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 10px 20px; background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 8px; cursor: pointer; font-family: 'Kanit'; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: black; font-weight: bold; }
        .admin-section { display: none; }
        .admin-section.active { display: block; animation: fadeIn 0.4s ease; }

        .admin-item { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--glass-border); margin-bottom: 10px; }
        
        /* Real-time Status Dot */
        .live-dot { display: inline-block; width: 10px; height: 10px; background-color: var(--success); border-radius: 50%; margin-right: 5px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        #alert { position: fixed; bottom: 20px; right: 20px; padding: 15px 25px; border-radius: 12px; color: white; font-weight: 600; display: none; z-index: 999; }
        #alert.show { display: block; }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="switchView('home')">⚡ Tanny Hub</div>
        <div class="nav-right" id="nav-buttons"></div>
    </nav>

    <!-- หน้าแรก -->
    <div id="view-home" class="view active">
        <div class="hero">
            <h1>ศูนย์รวมสคริปต์</h1>
            <p>กดคัดลอกเพื่อนำไปใช้ใน Executor</p>
        </div>
        <div class="grid" id="script-container"></div>
    </div>

    <!-- หน้าล็อกอิน -->
    <div id="view-auth" class="view">
        <div class="glass-box auth-box">
            <h2 id="auth-title" style="margin-bottom: 20px;">เข้าสู่ระบบ</h2>
            <input type="text" id="auth-username" placeholder="ชื่อผู้ใช้">
            <input type="password" id="auth-password" placeholder="รหัสผ่าน">
            <button class="btn btn-primary" id="auth-submit-btn" style="width: 100%; margin-bottom: 15px;" onclick="handleAuthSubmit()">เข้าสู่ระบบ</button>
            <p style="color: var(--text-muted); font-size: 14px; cursor: pointer; text-decoration: underline;" onclick="toggleAuthMode()" id="auth-toggle-text">ยังไม่มีบัญชี? สมัครสมาชิกที่นี่</p>
        </div>
    </div>

    <!-- หน้าหลังบ้าน (Admin) -->
    <div id="view-admin" class="view">
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchAdminTab('scripts', this)">📋 จัดการสคริปต์</button>
            <button class="tab-btn" onclick="switchAdminTab('users', this)">👥 ดูรายชื่อผู้ใช้ (Live)</button>
        </div>

        <!-- แท็บจัดการสคริปต์ -->
        <div id="tab-scripts" class="admin-section active">
            <div class="glass-box" style="margin-bottom: 20px;">
                <h3 style="margin-bottom: 15px;">➕ เพิ่มสคริปต์ใหม่</h3>
                <input type="text" id="new-name" placeholder="ชื่อสคริปต์">
                <input type="text" id="new-desc" placeholder="คำอธิบาย">
                <input type="text" id="new-url" placeholder="ลิงก์ Raw Script (https://...)">
                <button class="btn btn-success" onclick="addScript()">บันทึกสคริปต์</button>
            </div>
            <div id="admin-script-list"></div>
        </div>

        <!-- แท็บดูรายชื่อผู้ใช้ Real-time -->
        <div id="tab-users" class="admin-section">
            <div class="glass-box" style="margin-bottom: 20px;">
                <h3><span class="live-dot"></span> รายชื่อผู้ใช้ในระบบ (อัปเดตเรียลไทม์)</h3>
                <p style="color:var(--text-muted); font-size:12px; margin-top:5px;">*หน้านี้จะอัปเดตอัตโนมัติทุก 1 วินาที</p>
            </div>
            <div id="admin-user-list"></div>
        </div>
    </div>

    <div id="alert">Alert!</div>

    <script>
        // ==========================================
        // ระบบฐานข้อมูล (LocalStorage + Memory Fallback)
        // ==========================================
        const now = new Date().toLocaleString('th-TH');
        let memoryUsers = [{ id: 1, username: "admin", password: "admin123", role: "admin", date: now }];
        let memoryScripts = [{ id: 1, name: "Tanny Universal Hub", desc: "Universal Script", url: "https://raw.githubusercontent.com/EdgeIY/infiniteyield/master/source" }];

        function getUsers() { try { return JSON.parse(localStorage.getItem('tanny_users')) || memoryUsers; } catch(e) { return memoryUsers; } }
        function saveUsers(u) { memoryUsers = u; try { localStorage.setItem('tanny_users', JSON.stringify(u)); } catch(e) {} }

        function getScripts() { try { return JSON.parse(localStorage.getItem('tanny_scripts')) || memoryScripts; } catch(e) { return memoryScripts; } }
        function saveScripts(s) { memoryScripts = s; try { localStorage.setItem('tanny_scripts', JSON.stringify(s)); } catch(e) {} }

        function getCurrentUser() { try { return JSON.parse(sessionStorage.getItem('tanny_session')) || null; } catch(e) { return null; } }
        function setSession(u) { try { if(u) sessionStorage.setItem('tanny_session', JSON.stringify(u)); else sessionStorage.removeItem('tanny_session'); } catch(e) {} updateNavbar(); }

        // ==========================================
        // ระบบ Navbar & Routing
        // ==========================================
        function updateNavbar() {
            const navBtns = document.getElementById('nav-buttons');
            const user = getCurrentUser();

            if (user) {
                let adminBtn = user.role === 'admin' ? `<button class="btn btn-success" onclick="switchView('admin')">🔒 หลังบ้าน</button>` : '';
                navBtns.innerHTML = `
                    ${adminBtn}
                    <span style="color:white; align-self:center; margin-right:10px;">👤 ${user.username}</span>
                    <button class="btn btn-danger" onclick="logout()">ออกจากระบบ</button>
                `;
            } else {
                navBtns.innerHTML = `<button class="btn btn-primary" onclick="switchView('auth')">🔑 เข้าสู่ระบบ / สมัคร</button>`;
            }
        }

        function switchView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (viewName === 'admin') {
                const user = getCurrentUser();
                if (!user || user.role !== 'admin') {
                    showAlert("❌ ไม่มีสิทธิ์เข้าถึง", true);
                    viewName = 'home';
                }
            }
            document.getElementById(`view-${viewName}`).classList.add('active');
        }

        function switchAdminTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            if(tabName === 'users') renderAdminUsers(); // อัปเดตทันทีเมื่อกดแท็บ
        }

        // ==========================================
        // ระบบ Auth (Login/Register)
        // ==========================================
        let isRegisterMode = false;

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
            document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
            document.getElementById('auth-toggle-text').innerText = isRegisterMode ? "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครสมาชิกที่นี่";
        }

        function handleAuthSubmit() {
            const username = document.getElementById('auth-username').value.trim();
            const password = document.getElementById('auth-password').value;

            if (!username || !password) { showAlert("⚠️ กรอกข้อมูลให้ครบ", true); return; }
            const users = getUsers();

            if (isRegisterMode) {
                if (users.find(u => u.username === username)) { showAlert("❌ ชื่อนี้ถูกใช้แล้ว", true); return; }
                
                // เพิ่มผู้ใช้ใหม่พร้อมบันทึกเวลาที่สมัคร
                users.push({ 
                    id: Date.now(), 
                    username: username, 
                    password: password, 
                    role: "user", 
                    date: new Date().toLocaleString('th-TH') 
                });
                saveUsers(users);
                
                showAlert("✅ สมัครสำเร็จ! เข้าสู่ระบบได้เลย");
                isRegisterMode = false;
                toggleAuthMode();
                document.getElementById('auth-password').value = '';
            } else {
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    setSession(user);
                    showAlert(`✅ ยินดีต้อนรับ ${user.username}`);
                    document.getElementById('auth-username').value = '';
                    document.getElementById('auth-password').value = '';
                    switchView('home');
                } else { showAlert("❌ ข้อมูลไม่ถูกต้อง", true); }
            }
        }

        function logout() {
            setSession(null);
            showAlert("👋 ออกจากระบบแล้ว");
            switchView('home');
        }

        // ==========================================
        // ระบบจัดการสคริปต์ & ผู้ใช้
        // ==========================================
        function renderHome() {
            const container = document.getElementById('script-container');
            const scripts = getScripts();
            container.innerHTML = '';
            scripts.forEach(s => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${s.name}</h3>
                        <p>${s.desc}</p>
                        <button class="btn btn-primary" style="width:100%" onclick="copyScript('${s.url}')">📋 คัดลอกสคริปต์</button>
                    </div>
                `;
            });
        }

        function renderAdminScripts() {
            const container = document.getElementById('admin-script-list');
            const scripts = getScripts();
            container.innerHTML = '';
            scripts.forEach(s => {
                container.innerHTML += `
                    <div class="admin-item">
                        <div>
                            <h4 style="color:white;">${s.name}</h4>
                            <p style="color:var(--text-muted); font-size:12px;">${s.desc}</p>
                        </div>
                        <button class="btn btn-danger" onclick="deleteScript(${s.id})">ลบ</button>
                    </div>
                `;
            });
        }

        // --- ระบบแสดงผู้ใช้แบบ Real-time ---
        function renderAdminUsers() {
            const container = document.getElementById('admin-user-list');
            const users = getUsers();
            
            // เรียงจากคนสมัครล่าสุดขึ้นก่อน
            users.sort((a, b) => b.id - a.id);

            container.innerHTML = '';
            users.forEach(u => {
                const roleColor = u.role === 'admin' ? 'var(--primary)' : 'var(--text-muted)';
                container.innerHTML += `
                    <div class="admin-item">
                        <div>
                            <h4 style="color:white;">👤 ${u.username} <span style="font-size:12px; color:${roleColor};">[${u.role}]</span></h4>
                            <p style="color:var(--text-muted); font-size:12px;">📅 สมัครเมื่อ: ${u.date}</p>
                        </div>
                    </div>
                `;
            });
        }

        // ตั้งเวลาให้อัปเดตผู้ใช้ทุกๆ 1 วินาที (ถ้าอยู่ในแท็บผู้ใช้)
        setInterval(() => {
            if(document.getElementById('view-admin').classList.contains('active') && 
               document.getElementById('tab-users').classList.contains('active')) {
                renderAdminUsers();
            }
        }, 1000);

        function addScript() {
            const name = document.getElementById('new-name').value;
            const desc = document.getElementById('new-desc').value;
            const url = document.getElementById('new-url').value;
            if (!name || !url) { showAlert("⚠️ กรอกชื่อและลิงก์", true); return; }
            
            const scripts = getScripts();
            scripts.push({ id: Date.now(), name: name, desc: desc || "-", url: url });
            saveScripts(scripts);
            
            document.getElementById('new-name').value = '';
            document.getElementById('new-desc').value = '';
            document.getElementById('new-url').value = '';
            showAlert("✅ เพิ่มสำเร็จ!");
            renderHome();
            renderAdminScripts();
        }

        function deleteScript(id) {
            if(confirm("ลบสคริปต์นี้?")) {
                saveScripts(getScripts().filter(s => s.id !== id));
                showAlert("🗑️ ลบแล้ว");
                renderHome();
                renderAdminScripts();
            }
        }

        function copyScript(url) {
            navigator.clipboard.writeText(`loadstring(game:HttpGet("${url}"))()`).then(() => showAlert("✅ คัดลอกแล้ว!"));
        }

        function showAlert(msg, isError = false) {
            const alertBox = document.getElementById('alert');
            alertBox.innerText = msg;
            alertBox.style.background = isError ? 'var(--danger)' : 'var(--success)';
            alertBox.classList.add('show');
            setTimeout(() => alertBox.classList.remove('show'), 3000);
        }

        // --- โหลดครั้งแรก ---
        document.addEventListener("DOMContentLoaded", () => {
            if(!getUsers().length) saveUsers(memoryUsers);
            if(!getScripts().length) saveScripts(memoryScripts);
            updateNavbar();
            renderHome();
            renderAdminScripts();
            renderAdminUsers();
        });
    </script>
</body>
</html>
