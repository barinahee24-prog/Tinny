<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shorts Feed (API Version) 📡</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #fff; overflow: hidden; }

    .feed { height: 100dvh; width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
    .feed::-webkit-scrollbar { display: none; }

    .short-item { position: relative; height: 100dvh; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; justify-content: center; align-items: center; background: #000; }
    .short-item iframe { width: 100%; height: 100%; max-width: calc(100dvh * 9 / 16); border: none; pointer-events: auto; }

    .overlay { position: absolute; inset: 0; pointer-events: none; max-width: calc(100dvh * 9 / 16); margin: 0 auto; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.3) 100%); }
    .info { pointer-events: auto; max-width: 75%; margin-bottom: 10px; }
    .channel { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #ff0050, #ff9050); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; flex-shrink: 0; border: 2px solid #fff; }
    .channel-name { font-weight: 600; font-size: 14px; }
    .subscribe-btn { pointer-events: auto; background: #ff0050; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; margin-left: 8px; transition: transform 0.2s; }
    .subscribe-btn:active { transform: scale(0.95); }
    .subscribe-btn.subscribed { background: #333; }
    .title { font-size: 14px; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .actions { position: absolute; right: 12px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; pointer-events: auto; }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: #fff; cursor: pointer; font-size: 11px; transition: transform 0.2s; }
    .action-btn:active { transform: scale(0.9); }
    .action-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; font-size: 20px; transition: background 0.2s; }
    .action-btn.liked .action-icon { background: #ff0050; }
    .action-btn.liked .action-icon svg { fill: #fff; }

    .top-bar { position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
    .top-bar h1 { font-size: 18px; font-weight: 700; background: linear-gradient(90deg, #ff0050, #ff9050); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .top-bar .counter { font-size: 12px; opacity: 0.7; pointer-events: auto; }

    .loading { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; transition: opacity 0.5s; }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #ff0050; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { margin-top: 16px; font-size: 14px; opacity: 0.7; text-align: center; padding: 0 20px; }

    .mute-indicator { position: fixed; top: 60px; right: 16px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); padding: 8px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; z-index: 100; cursor: pointer; transition: opacity 0.3s; }
    .mute-indicator:hover { opacity: 0.8; }

    .error-banner { position: fixed; top: 110px; left: 16px; right: 16px; background: rgba(200, 0, 0, 0.9); color: #fff; padding: 12px; border-radius: 8px; font-size: 12px; z-index: 1000; text-align: center; display: none; }

    @media (min-width: 768px) { .short-item { background: #0a0a0a; } .short-item iframe { border-radius: 16px; } .top-bar h1 { font-size: 22px; } }
</style>
</head>
<body>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">กำลังดึงข้อมูล Shorts จาก YouTube API...</p>
</div>

<div class="top-bar">
    <h1>⚡ Shorts API Feed</h1>
    <span class="counter" id="counter">0 / 0</span>
</div>

<div class="mute-indicator" id="muteIndicator" onclick="toggleMute()">
    <span id="muteIcon">🔇</span>
    <span id="muteText">ปิดเสียง</span>
</div>

<div class="error-banner" id="errorBanner"></div>

<div class="feed" id="feed"></div>

<script>
// ============================================================
// ⚙️ CONFIG — ใส่ค่าของคุณที่นี่
// ============================================================
const CONFIG = {
    API_KEY: 'https://m.youtube.com/shorts/',   // ← ใส่ API Key ของคุณ
    CHANNEL_ID: 'UCxxxxxxxxxxxxxxxx',       // ← ใส่ Channel ID ของคุณ
    MAX_RESULTS: 20,                        // จำนวน Shorts สูงสุดที่ต้องการ
    SEARCH_QUERY: ''                        // เว้นว่างไว้เพื่อดึงทั้งหมดของช่อง
};

// ============================================================
// 🎬 MAIN FLOW
// ============================================================
const feedEl = document.getElementById('feed');
const counterEl = document.getElementById('counter');
const loadingEl = document.getElementById('loading');
const loadingText = document.getElementById('loadingText');
const errorBanner = document.getElementById('errorBanner');

let currentIndex = 0;
let isMuted = true;
let shortsData = [];

async function init() {
    try {
        if (CONFIG.API_KEY === 'YOUR_YOUTUBE_DATA_API_KEY') {
            throw new Error('กรุณาใส่ API_KEY ของคุณในส่วน CONFIG');
        }
        if (CONFIG.CHANNEL_ID === 'UCxxxxxxxxxxxxxxxx') {
            throw new Error('กรุณาใส่ CHANNEL_ID ของคุณในส่วน CONFIG');
        }

        loadingText.textContent = 'กำลังค้นหาวิดีโอ...';
        shortsData = await fetchShorts();

        if (shortsData.length === 0) {
            throw new Error('ไม่พบ Shorts ในช่องนี้ (อาจเป็นเพราะคลิปทั้งหมดยาวเกิน 60 วินาที หรือช่องยังไม่มี Shorts)');
        }

        loadingText.textContent = `พบ ${shortsData.length} Shorts กำลังสร้างฟีด...`;
        buildFeed(shortsData);
        startObserving();

    } catch (err) {
        console.error(err);
        loadingText.textContent = 'เกิดข้อผิดพลาด';
        errorBanner.style.display = 'block';
        errorBanner.textContent = '❌ ' + err.message;
        loadingEl.classList.add('hidden');
        setTimeout(() => loadingEl.style.display = 'none', 500);
    }
}

// ============================================================
// 📡 YOUTUBE DATA API — ดึงและกรอง Shorts
// ============================================================
async function fetchShorts() {
    // 1. ค้นหาวิดีโอในช่อง (videoDuration=short = < 4 นาที)
    //    ใช้ videoDimension=2d เพื่อตัดวิดีโอ 3D ออก
    const searchParams = new URLSearchParams({
        key: CONFIG.API_KEY,
        channelId: CONFIG.CHANNEL_ID,
        part: 'snippet',
        type: 'video',
        order: 'date',
        videoDuration: 'short',
        videoDimension: '2d',
        maxResults: Math.min(CONFIG.MAX_RESULTS, 50).toString()
    });

    if (CONFIG.SEARCH_QUERY) {
        searchParams.set('q', CONFIG.SEARCH_QUERY);
    }

    const searchUrl = `https://www.googleapis.com/youtube/v3/search?${searchParams}`;
    const searchRes = await fetch(searchUrl);

    if (!searchRes.ok) {
        const err = await searchRes.json();
        throw new Error(getApiErrorMessage(err));
    }

    const searchData = await searchRes.json();
    if (!searchData.items || searchData.items.length === 0) {
        return [];
    }

    const videoIds = searchData.items.map(item => item.id.videoId).join(',');

    // 2. ดึงรายละเอียดเพื่อตรวจสอบความยาวจริง (ต้อง ≤ 60 วินาที)
    const detailsParams = new URLSearchParams({
        key: CONFIG.API_KEY,
        id: videoIds,
        part: 'contentDetails,snippet,statistics'
    });

    const detailsUrl = `https://www.googleapis.com/youtube/v3/videos?${detailsParams}`;
    const detailsRes = await fetch(detailsUrl);

    if (!detailsRes.ok) {
        const err = await detailsRes.json();
        throw new Error(getApiErrorMessage(err));
    }

    const detailsData = await detailsRes.json();

    // 3. กรองเฉพาะ Shorts (ความยาว ≤ 60 วินาที)
    const shorts = detailsData.items.filter(item => {
        const durationSec = parseISODuration(item.contentDetails.duration);
        return durationSec > 0 && durationSec <= 60;
    }).map(item => ({
        videoId: item.id,
        channel: item.snippet.channelTitle,
        avatar: item.snippet.channelTitle.charAt(0).toUpperCase(),
        title: item.snippet.title,
        likes: parseInt(item.statistics?.likeCount || 0),
        viewCount: parseInt(item.statistics?.viewCount || 0)
    }));

    return shorts;
}

function parseISODuration(iso) {
    // แปลง PT1M30S → 90 วินาที
    const match = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!match) return 0;
    const h = parseInt(match[1] || 0);
    const m = parseInt(match[2] || 0);
    const s = parseInt(match[3] || 0);
    return h * 3600 + m * 60 + s;
}

function getApiErrorMessage(err) {
    const reason = err?.error?.errors?.[0]?.reason;
    const map = {
        'quotaExceeded': 'โควต้า API หมดแล้ว (search.list มีขีดจำกัด 100 ครั้ง/วัน)',
        'keyInvalid': 'API Key ไม่ถูกต้อง',
        'channelNotFound': 'ไม่พบช่องที่ระบุ',
        'forbidden': 'การเข้าถึงถูกปฏิเสธ (อาจต้องเปิดใช้ YouTube Data API v3 ใน Cloud Console)'
    };
    return map[reason] || err?.error?.message || 'เกิดข้อผิดพลาดในการเรียก API';
}

// ============================================================
// 🎬 BUILD FEED (เหมือนเวอร์ชันก่อนหน้า)
// ============================================================
function buildFeed(data) {
    feedEl.innerHTML = '';
    data.forEach((short, index) => {
        const item = document.createElement('div');
        item.className = 'short-item';
        item.dataset.index = index;
        item.dataset.videoId = short.videoId;

        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${short.videoId}?` + new URLSearchParams({
            autoplay: 1, mute: 1, controls: 1, rel: 0, modestbranding: 1,
            playsinline: 1, loop: 1, playlist: short.videoId, enablejsapi: 1,
            origin: window.location.origin
        }).toString();
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.loading = 'lazy';
        iframe.title = short.title;

        const overlay = document.createElement('div');
        overlay.className = 'overlay';
        overlay.innerHTML = `
            <div class="info">
                <div class="channel">
                    <div class="avatar">${short.avatar}</div>
                    <span class="channel-name">@${short.channel.toLowerCase().replace(/\s+/g, '')}</span>
                    <button class="subscribe-btn" onclick="event.stopPropagation(); this.classList.toggle('subscribed'); this.textContent = this.classList.contains('subscribed') ? 'ติดตามแล้ว' : 'ติดตาม';">ติดตาม</button>
                </div>
                <div class="title">${escapeHtml(short.title)}</div>
            </div>
            <div class="actions">
                <button class="action-btn like-btn" onclick="event.stopPropagation(); toggleLike(this);">
                    <div class="action-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                        </svg>
                    </div>
                    <span class="like-count">${formatNumber(short.likes)}</span>
                </button>
                <button class="action-btn" onclick="event.stopPropagation();">
                    <div class="action-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                    </div>
                    <span>ความคิดเห็น</span>
                </button>
                <button class="action-btn" onclick="event.stopPropagation(); shareShort('${short.videoId}');">
                    <div class="action-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                        </svg>
                    </div>
                    <span>แชร์</span>
                </button>
            </div>
        `;

        item.appendChild(iframe);
        item.appendChild(overlay);
        feedEl.appendChild(item);
    });
    counterEl.textContent = `1 / ${data.length}`;
}

// ============================================================
// 🎯 OBSERVER / UTILITIES (เหมือนเวอร์ชันก่อนหน้า)
// ============================================================
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        const iframe = entry.target.querySelector('iframe');
        if (!iframe || !iframe.contentWindow) return;
        const index = parseInt(entry.target.dataset.index);
        const command = entry.isIntersecting ? 'playVideo' : 'pauseVideo';
        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: command, args: [] }), '*');
        if (entry.isIntersecting) { currentIndex = index; updateCounter(); }
    });
}, { threshold: 0.6, root: feedEl });

function startObserving() {
    document.querySelectorAll('.short-item').forEach(item => observer.observe(item));
    loadingEl.classList.add('hidden');
    setTimeout(() => loadingEl.style.display = 'none', 500);
}

function updateCounter() { counterEl.textContent = `${currentIndex + 1} / ${shortsData.length}`; }
function formatNumber(num) { if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M'; if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K'; return num.toString(); }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

function toggleLike(btn) {
    btn.classList.toggle('liked');
    const svg = btn.querySelector('svg');
    svg.setAttribute('fill', btn.classList.contains('liked') ? 'currentColor' : 'none');
}

function toggleMute() {
    isMuted = !isMuted;
    document.getElementById('muteIcon').textContent = isMuted ? '🔇' : '🔊';
    document.getElementById('muteText').textContent = isMuted ? 'ปิดเสียง' : 'เปิดเสียง';
    document.querySelectorAll('.short-item iframe').forEach(iframe => {
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: isMuted ? 'mute' : 'unMute', args: [] }), '*');
    });
}

function shareShort(videoId) {
    const url = `https://youtube.com/shorts/${videoId}`;
    if (navigator.share) { navigator.share({ title: 'ดู Shorts นี้สิ!', url }).catch(() => {}); }
    else { navigator.clipboard.writeText(url).then(() => showToast('คัดลอกลิงก์แล้ว!')); }
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:1000;animation:fadeInUp 0.3s ease;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const items = document.querySelectorAll('.short-item');
        const targetIndex = e.key === 'ArrowDown' ? Math.min(currentIndex + 1, items.length - 1) : Math.max(currentIndex - 1, 0);
        items[targetIndex]?.scrollIntoView({ behavior: 'smooth' });
    }
    if (e.key === 'm' || e.key === 'M') toggleMute();
});

// ============================================================
// 🚀 START
// ============================================================
init();
</script>

<style>
@keyframes fadeInUp { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
</style>

</body>
</html>
